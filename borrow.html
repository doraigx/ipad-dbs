<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad貸出システム - 利用者</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #eaeaea; }
        body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 630px; margin: 0 auto; }
        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 30px; }
        h2 { font-size: 1.3rem; margin-top: 30px; margin-bottom: 10px; padding-left: 8px; border-left: 4px solid #2196f3; }
        h3 { font-size: 1rem; color: #aaa; margin-top: 15px; margin-bottom: 5px; padding-left: 5px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        
        .input-group { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 10px; }
        input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 1rem; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #2196f3; color: white; }
        
        /* 縦並び用のボタンレイアウト */
        .block-btn { width: 100%; padding: 12px; margin-top: 8px; font-size: 0.95rem; display: block; box-sizing: border-box; }
        /* ログアウトボタン用（オレンジ系） */
        .logout-btn { background: #ff5722; color: white; margin-top: 15px; }
        .logout-btn:hover { background: #e64a19; }

        .profile-section { display: flex; flex-direction: column; gap: 4px; }
        .info-row { font-size: 0.9rem; margin: 4px 0; color: #ccc; }

        /* 1つの大きな蛇腹（アコーディオン）メニューのスタイル */
        .accordion-item { border: 1px solid #333; border-radius: 6px; margin-top: 15px; overflow: hidden; }
        .accordion-trigger { background: #252525; padding: 12px 15px; font-size: 0.85rem; color: #aaa; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; user-select: none; transition: background 0.2s; }
        .accordion-trigger:hover { background: #2d2d2d; color: #fff; }
        .accordion-trigger::after { content: '▼'; font-size: 0.7rem; transition: transform 0.2s; }
        .accordion-item.open .accordion-trigger::after { transform: rotate(180deg); }
        .accordion-content { background: #0f0f0f; overflow: hidden; transition: max-height 0.2s ease-out; }
        
        /* 蛇腹の中のレイアウト構造 */
        .accordion-inner { padding: 18px; display: flex; flex-direction: column; gap: 20px; }
        .sub-section-title { font-size: 0.8rem; font-weight: bold; color: #666; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .uid-text { font-size: 0.75rem; color: #888; word-break: break-all; font-family: monospace; background: #050505; padding: 8px 12px; border-radius: 4px; border: 1px solid #1a1a1a; margin-top: 5px; }

        /* グリッドレイアウト */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-top: 15px; }
        .ipad-tile { height: 115px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); text-align: center; padding: 10px; box-sizing: border-box; }
        .ipad-tile:hover { transform: translateY(-3px); }
        
        .available { background: #4caf50; color: white; } 
        .borrowed { background: #f44336; color: white; }  
        .my-borrowed { background: #ff9800; color: white; } 
        
        .tile-info { font-size: 0.75rem; font-weight: normal; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        
        /* 機材名が長い場合に最大2行で綺麗に折り返すためのCSS設定 */
        .tile-model { 
            font-size: 0.65rem; 
            opacity: 0.9; 
            font-weight: normal; 
            width: 100%;
            word-break: break-all; 
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2; 
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
            max-height: 2.4em;
            margin: auto 0; 
        }
        
        /* 空白時のメッセージ */
        .empty-message { grid-column: 1 / -1; background: #1e1e1e; color: #666; text-align: center; padding: 20px; border-radius: 8px; font-size: 0.9rem; border: 1px dashed #333; }
    </style>
</head>
<body>
<div class="container">
    <h1>📱 iPad 貸出リスト</h1>

    <div class="card" id="auth-section">
        <p id="user-info">ユーザー情報を読み込み中...</p>
    </div>

    <h2>借りているiPad</h2>
    <h3>iPad製品</h3>
    <div class="grid" id="my-ipad-grid"></div>
    <h3>その他機材</h3>
    <div class="grid" id="my-other-grid"></div>

    <h2>貸出・返却</h2>
    <h3>iPad製品 一覧</h3>
    <div class="grid" id="ipad-grid"></div>
    <h3>その他機材 一覧</h3>
    <div class="grid" id="other-grid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBfoLWu2PPbUoJXH7uxxXCBjxNVWT22gzU",
        authDomain: "ipad-database-2c20b.firebaseapp.com",
        projectId: "ipad-database-2c20b",
        storageBucket: "ipad-database-2c20b.firebasestorage.app",
        messagingSenderId: "558760087924",
        appId: "1:558760087924:web:857e8e8096d78671c49c21",
        measurementId: "G-CEM2VYFRN9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let myStudentId = "";
    let myCustomName = "";

    // 🔒 認証状態監視
    onAuthStateChanged(auth, async (user) => {
        const authSection = document.getElementById('auth-section');
        if (!user) {
            authSection.innerHTML = `<p style="text-align:center;"><button id="login-btn">Googleログインして利用開始</button></p>`;
            document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        } else {
            onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                let idInputHTML = "";
                let nameInputVal = user.displayName;

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    myStudentId = data.studentId || "";
                    myCustomName = data.customName || user.displayName;
                    nameInputVal = myCustomName;
                }

                if (!myStudentId) {
                    idInputHTML = `
                        <div class="info-row">⚠️ 学籍番号が登録されていません：</div>
                        <div class="input-group">
                            <input type="text" id="student-id-input" placeholder="例: B260000">
                            <button id="save-profile-btn">登録確定</button>
                        </div>
                    `;
                } else {
                    idInputHTML = `
                        <div class="info-row">🔑 学籍番号: <strong>${myStudentId}</strong> <span style="font-size:0.75rem; color:#888;">(※変更不可)</span></div>
                        
                        <div class="accordion-item" id="profile-accordion">
                            <div class="accordion-trigger" onclick="window.toggleAccordion('profile-accordion')">🔧 登録情報の編集・確認</div>
                            <div class="accordion-content" style="max-height: 0px;">
                                <div class="accordion-inner">
                                    
                                    <div>
                                        <div class="sub-section-title">👤 本名・表示名の変更</div>
                                        <input type="text" id="custom-name-input" value="${nameInputVal}" style="width:100%; margin-top:10px; box-sizing:border-box;">
                                        <button id="update-name-btn" class="block-btn">名前の変更を保存する</button>
                                    </div>

                                    <div>
                                        <div class="sub-section-title">⚙️ 管理者問い合わせ用ID</div>
                                        <div class="uid-text">${user.uid}</div>
                                    </div>

                                    <div>
                                        <div class="sub-section-title">🚪 認証セッション</div>
                                        <button id="logout-btn" class="block-btn logout-btn">システムからログアウト</button>
                                    </div>

                                </div>
                            </div>
                        </div>
                    `;
                }

                authSection.innerHTML = `
                    <div class="profile-section">
                        <div class="info-row" style="font-size:1.1rem; margin-bottom: 5px;">👋 こんにちは、<strong>${nameInputVal}</strong> さん</div>
                        ${idInputHTML}
                    </div>
                `;

                document.getElementById('save-profile-btn')?.addEventListener('click', saveNewStudentId);
                document.getElementById('update-name-btn')?.addEventListener('click', updateCustomName);
                document.getElementById('logout-btn')?.addEventListener('click', handleLogout);
                
                if (myStudentId) {
                    // 💡 「iPad」と「その他機材」それぞれの表示エリアを完全に独立させて処理を呼び出します
                    initSeparateGrids("ipads", "my-ipad-grid", "ipad-grid");
                    initSeparateGrids("other_equipments", "my-other-grid", "other-grid");
                }
            });
        }
    });

    // 蛇腹開閉
    window.toggleAccordion = function(id) {
        const accordion = document.getElementById(id);
        const content = accordion.querySelector('.accordion-content');
        if (accordion.classList.contains('open')) {
            accordion.classList.remove('open');
            content.style.maxHeight = '0px';
        } else {
            accordion.classList.add('open');
            content.style.maxHeight = content.scrollHeight + 'px'; 
        }
    };

    async function saveNewStudentId() {
        const idInput = document.getElementById('student-id-input').value.trim();
        if (!idInput) return alert("学籍番号を入力してください");
        try {
            await setDoc(doc(db, "users", auth.currentUser.uid), { studentId: idInput, customName: auth.currentUser.displayName }, { merge: true });
            alert("学籍番号を紐付けました！");
        } catch(e) { alert("登録に失敗しました。"); }
    }

    async function updateCustomName() {
        const newName = document.getElementById('custom-name-input').value.trim();
        if (!newName) return alert("名前を空欄にすることはできません。");
        try {
            await setDoc(doc(db, "users", auth.currentUser.uid), { customName: newName }, { merge: true });
            alert("表示名を変更しました。");
            window.toggleAccordion('profile-accordion');
        } catch(e) { alert("名前の変更に失敗しました。"); }
    }

    async function handleLogout() {
        if (!confirm("システムからログアウトしますか？")) return;
        try {
            await signOut(auth);
            alert("ログアウトしました。ログイン画面に戻ります。");
            window.location.replace("./login.html");
        } catch(e) { alert("ログアウトに失敗しました。"); }
    }

    // 💡 iPad製品とその他機材をそれぞれの専用エリアに完全に分けて、お互いが混ざらないように描画するロジック
    function initSeparateGrids(category, myGridId, mainGridId) {
        const myGrid = document.getElementById(myGridId);
        const mainGrid = document.getElementById(mainGridId);

        onSnapshot(collection(db, category), (snapshot) => {
            myGrid.innerHTML = ""; 
            mainGrid.innerHTML = ""; 

            const itemList = [];
            snapshot.forEach((docSnap) => {
                itemList.push({ id: docSnap.id, data: docSnap.data() });
            });
            itemList.sort((a, b) => Number(a.id) - Number(b.id));

            let myBorrowCount = 0;

            itemList.forEach((item) => {
                const id = item.id;
                const data = item.data;
                const modelName = data.model || "iPad";

                // HTMLのID重複バグを回避するための固有識別名
                const myTileId = `my-tile-${category}-${id}`;
                const mainTileId = `main-tile-${category}-${id}`;

                // 1. 自分が借りている機材（上の専用リストへ出力：オレンジ固定）
                if (data.status === "borrowed" && data.borrowedBy === myStudentId) {
                    myBorrowCount++;
                    const myTile = document.createElement('div');
                    myTile.id = myTileId;
                    myTile.className = "ipad-tile my-borrowed";
                    myTile.innerHTML = `
                        <div>No.${id}</div>
                        <div class="tile-model">${modelName}</div>
                        <div class="tile-info">🔄 返却</div>
                    `;
                    myTile.onclick = () => handleReturn(category, id);
                    myGrid.appendChild(myTile);
                }

                // 2. 全体リスト（下の通常リストへ出力：カテゴリごとに完全に分断されて表示されます）
                const mainTile = document.createElement('div');
                mainTile.id = mainTileId;

                if (data.status === "borrowed") {
                    if (data.borrowedBy === myStudentId) {
                        mainTile.className = "ipad-tile my-borrowed";
                        mainTile.innerHTML = `
                            <div>No.${id}</div>
                            <div class="tile-model">${modelName}</div>
                            <div class="tile-info">🔄 使用中</div>
                        `;
                        mainTile.onclick = () => handleReturn(category, id);
                    } else {
                        mainTile.className = "ipad-tile borrowed";
                        mainTile.innerHTML = `
                            <div>No.${id}</div>
                            <div class="tile-model">${modelName}</div>
                            <div class="tile-info">🔴 貸出不可</div>
                        `;
                    }
                } else {
                    mainTile.className = "ipad-tile available";
                    mainTile.innerHTML = `
                        <div>No.${id}</div>
                        <div class="tile-model">${modelName}</div>
                        <div class="tile-info">🟢 貸出可能</div>
                    `;
                    mainTile.onclick = () => handleBorrow(category, id, modelName);
                }
                mainGrid.appendChild(mainTile);
            });

            if (myBorrowCount === 0) {
                myGrid.innerHTML = `<div class="empty-message">現在、あなたが借りているiPadはありません。</div>`;
            }
        });
    }

    async function handleBorrow(category, id, model) {
        if (!myStudentId) return;
        if (!confirm(`No.${id} [${model}] を借りますか？`)) return;
        try {
            await setDoc(doc(db, category, String(id)), {
                status: "borrowed",
                borrowedBy: myStudentId,
                borrowedByName: myCustomName, 
                borrowedAt: new Date()
            }, { merge: true });
        } catch (e) { alert("貸出に失敗しました。"); }
    }

    async function handleReturn(category, id) {
        if (!confirm(`No.${id} を返却しますか？`)) return;
        try {
            await setDoc(doc(db, category, String(id)), { 
                status: "available", 
                borrowedBy: "", 
                borrowedByName: "" 
            }, { merge: true });
        } catch (e) { alert("返却に失敗しました。"); }
    }
</script>
</body>
</html>
