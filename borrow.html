<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad貸出システム - 利用者</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #eaeaea; }
        body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 630px; margin: 0 auto; }
        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 30px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 10px; }
        input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 1rem; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #2196f3; color: white; }
        
        .profile-section { display: flex; flex-direction: column; gap: 4px; }
        .info-row { font-size: 0.9rem; margin: 4px 0; color: #ccc; }

        /* 💡 蛇腹（アコーディオン）メニューの共通スタイル */
        .accordion-item { border: 1px solid #333; border-radius: 6px; margin-top: 12px; overflow: hidden; }
        .accordion-trigger { background: #252525; padding: 12px 15px; font-size: 0.85rem; color: #aaa; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; user-select: none; transition: background 0.2s; }
        .accordion-trigger:hover { background: #2d2d2d; color: #fff; }
        .accordion-trigger::after { content: '▼'; font-size: 0.7rem; transition: transform 0.2s; }
        .accordion-item.open .accordion-trigger::after { transform: rotate(180deg); }
        .accordion-content { background: #0f0f0f; max-height: 0; overflow: hidden; transition: max-height 0.2s ease-out; }
        
        /* 蛇腹の中身の内側余白 */
        .accordion-inner { padding: 15px; }
        .uid-text { font-size: 0.75rem; color: #888; word-break: break-all; font-family: monospace; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-top: 20px; }
        .ipad-tile { height: 110px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); text-align: center; padding: 10px; box-sizing: border-box; }
        .ipad-tile:hover { transform: translateY(-3px); }
        .available { background: #4caf50; color: white; } 
        .borrowed { background: #f44336; color: white; }  
        .tile-info { font-size: 0.75rem; margin-top: 8px; font-weight: normal; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px; }
        .tile-model { font-size: 0.65rem; opacity: 0.8; margin-top: 2px; font-weight: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
    </style>
</head>
<body>
<div class="container">
    <h1>📱 iPad 貸出ステーション</h1>

    <div class="card" id="auth-section">
        <p id="user-info">ユーザー情報を読み込み中...</p>
    </div>

    <h2>貸出・返却（タップしてください）</h2>
    <div class="grid" id="ipad-grid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBfoLWu2PPbUoJXH7uxxXCBjxNVWT22gzU",
        authDomain: "ipad-database-2c20b.firebaseapp.com",
        projectId: "ipad-database-2c20b",
        storageBucket: "ipad-database-2c20b.firebasestorage.app",
        messagingSenderId: "558760087924",
        appId: "1:558760087924:web:857e8e8096d78671c49c21",
        measurementId: "G-CEM2VYFRN9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let myStudentId = "";
    let myCustomName = "";

    // 🔒 認証状態監視
    onAuthStateChanged(auth, async (user) => {
        const authSection = document.getElementById('auth-section');
        if (!user) {
            authSection.innerHTML = `<p style="text-align:center;"><button id="login-btn">Googleログインして利用開始</button></p>`;
            document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        } else {
            onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                let idInputHTML = "";
                let nameInputVal = user.displayName;

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    myStudentId = data.studentId || "";
                    myCustomName = data.customName || user.displayName;
                    nameInputVal = myCustomName;
                }

                if (!myStudentId) {
                    // 初回：学籍番号未登録時は隠さずそのまま入力させる
                    idInputHTML = `
                        <div class="info-row">⚠️ 学籍番号が登録されていません：</div>
                        <div class="input-group">
                            <input type="text" id="student-id-input" placeholder="例: B260000">
                            <button id="save-profile-btn">登録確定</button>
                        </div>
                    `;
                } else {
                    // 💡 登録済み：学籍番号を表示し、名前変更フォームとUIDをそれぞれ個別の蛇腹にする
                    idInputHTML = `
                        <div class="info-row">🔑 学籍番号: <strong>${myStudentId}</strong> <span style="font-size:0.75rem; color:#888;">(※変更不可)</span></div>
                        
                        <div class="accordion-item" id="name-accordion">
                            <div class="accordion-trigger" onclick="window.toggleAccordion('name-accordion')">👤 本名・表示名を入力・変更する</div>
                            <div class="accordion-content">
                                <div class="accordion-inner">
                                    <div class="info-row">表示名を入力（自由に変更できます）:</div>
                                    <div class="input-group">
                                        <input type="text" id="custom-name-input" value="${nameInputVal}">
                                        <button id="update-name-btn">名前を変更</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-item" id="uid-accordion">
                            <div class="accordion-trigger" onclick="window.toggleAccordion('uid-accordion')">⚙️ 管理者問い合わせ用IDを表示</div>
                            <div class="accordion-content">
                                <div class="accordion-inner uid-text">${user.uid}</div>
                            </div>
                        </div>
                    `;
                }

                authSection.innerHTML = `
                    <div class="profile-section">
                        <div class="info-row" style="font-size:1.1rem; margin-bottom: 5px;">👋 こんにちは、<strong>${nameInputVal}</strong> さん</div>
                        ${idInputHTML}
                    </div>
                `;

                document.getElementById('save-profile-btn')?.addEventListener('click', saveNewStudentId);
                document.getElementById('update-name-btn')?.addEventListener('click', updateCustomName);
                
                if (myStudentId) {
                    initDynamicIpadGrid();
                }
            });
        }
    });

    // 💡 改良：指定されたIDの蛇腹メニューを個別に開閉制御する汎用ロジック
    window.toggleAccordion = function(id) {
        const accordion = document.getElementById(id);
        const content = accordion.querySelector('.accordion-content');
        
        if (accordion.classList.contains('open')) {
            accordion.classList.remove('open');
            content.style.maxHeight = '0px';
        } else {
            accordion.classList.add('open');
            content.style.maxHeight = content.scrollHeight + 'px'; // 内部パーツの高さに合わせてピッタリ広げる
        }
    };

    async function saveNewStudentId() {
        const idInput = document.getElementById('student-id-input').value.trim();
        if (!idInput) return alert("学籍番号を入力してください");
        try {
            await setDoc(doc(db, "users", auth.currentUser.uid), { 
                studentId: idInput,
                customName: auth.currentUser.displayName 
            }, { merge: true });
            alert("学籍番号を紐付けました！");
        } catch(e) { alert("登録に失敗しました。"); }
    }

    async function updateCustomName() {
        const newName = document.getElementById('custom-name-input').value.trim();
        if (!newName) return alert("名前を空欄にすることはできません。");
        try {
            await setDoc(doc(db, "users", auth.currentUser.uid), { customName: newName }, { merge: true });
            alert("表示名を変更しました。");
            
            // 名前変更が成功したら、蛇腹を自動でスッキリ閉じる
            window.toggleAccordion('name-accordion');
        } catch(e) { alert("名前の変更に失敗しました。"); }
    }

    function initDynamicIpadGrid() {
        const grid = document.getElementById('ipad-grid');
        onSnapshot(collection(db, "ipads"), (snapshot) => {
            grid.innerHTML = ""; 
            snapshot.forEach((docSnap) => {
                const id = docSnap.id;
                const data = docSnap.data();
                const modelName = data.model || "iPad";
                const tile = document.createElement('div');
                tile.id = `ipad-${id}`;
                
                if (data.status === "borrowed") {
                    tile.className = "ipad-tile borrowed";
                    tile.innerHTML = `
                        No.${id}
                        <div class="tile-model">${modelName}</div>
                        <div class="tile-info">${data.borrowedBy === myStudentId ? "🔄 返却する" : "🔴 貸出中"}</div>
                    `;
                    if (data.borrowedBy === myStudentId) {
                        tile.onclick = () => handleReturn(id);
                    }
                } else {
                    tile.className = "ipad-tile available";
                    tile.innerHTML = `
                        No.${id}
                        <div class="tile-model">${modelName}</div>
                        <div class="tile-info">🟢 借用可能</div>
                    `;
                    tile.onclick = () => handleBorrow(id, modelName);
                }
                grid.appendChild(tile);
            });
        });
    }

    async function handleBorrow(id, model) {
        if (!myStudentId) return;
        if (!confirm(`No.${id} [${model}] を借りますか？`)) return;
        try {
            await setDoc(doc(db, "ipads", String(id)), {
                status: "borrowed",
                borrowedBy: myStudentId,
                borrowedAt: new Date()
            }, { merge: true });
        } catch (e) { alert("貸出に失敗しました。"); }
    }

    async function handleReturn(id) {
        if (!confirm(`No.${id} を返却しますか？`)) return;
        try {
            await setDoc(doc(db, "ipads", String(id)), {
                status: "available",
                borrowedBy: "",
                returnedAt: new Date()
            }, { merge: true });
        } catch (e) { alert("返却に失敗しました。"); }
    }
</script>
</body>
</html>
