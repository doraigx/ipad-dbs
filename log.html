<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機材使用システム - 履歴ログ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f4f7f9; color: #333; margin: 0; padding: 15px 15px; box-sizing: border-box; font-size: 0.9rem; }
        .container { width: 100%; max-width: 100%; margin: 0 auto; }
        
        h1 { text-align: center; margin-bottom: 15px; color: #0d47a1; font-size: 1.6rem; }
        h2 { font-size: 1.2rem; color: #444; border-left: 4px solid #0d47a1; padding-left: 10px; margin-top: 25px; margin-bottom: 10px; }
        
        .nav-container { margin-bottom: 15px; display: flex; justify-content: flex-start; }
        .back-btn { padding: 6px 15px; background: #607d8b; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; text-decoration: none; }
        .back-btn:hover { background: #455a64; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); font-size: 0.82rem; margin-bottom: 25px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { background-color: #0d47a1; color: white; font-weight: bold; font-size: 0.85rem; }
        
        tr.log-row-rent { background-color: #ffebee; }   
        tr.log-row-return { background-color: #e8f5e9; } 
        tr:hover { filter: brightness(0.97); }
        
        .badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.72rem; color: white; display: inline-block; }
        .badge-ipad { background: #2196f3; }
        .badge-other { background: #9c27b0; }
        .badge-rent { background: #f44336; }
        .badge-return { background: #4caf50; }
        
        mark { background: #ffeb3b; font-weight: bold; padding: 2px 6px; border-radius: 3px; font-size: 0.75rem; }
        .empty-log-msg { text-align: center; color: #888; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
<div class="container">
    <h1>物品・機材 使用返却履歴ログ</h1>
    
    <div class="nav-container">
        <a href="./admin.html" class="back-btn">データベース管理画面に戻る</a>
    </div>
    
    <div id="log-sections-wrapper">
        <p style="text-align: center; color: #888;">ログをリアルタイム同期中...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBfoLWu2PPbUoJXH7uxxXCBjxNVWT22gzU",
        authDomain: "ipad-database-2c20b.firebaseapp.com",
        projectId: "ipad-database-2c20b",
        storageBucket: "ipad-database-2c20b.firebasestorage.app",
        messagingSenderId: "558760087924",
        appId: "1:558760087924:web:857e8e8096d78671c49c21",
        measurementId: "G-CEM2VYFRN9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const wrapper = document.getElementById('log-sections-wrapper');

    onSnapshot(collection(db, "logs"), (snapshot) => {
        wrapper.innerHTML = "";
        
        if (snapshot.empty) {
            wrapper.innerHTML = `<div class="empty-log-msg">記録されている使用履歴はありません。</div>`;
            return;
        }

        const ipadLogsByYear = {};
        const otherLogsList = [];

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if (!data || !data.borrowedAt || typeof data.borrowedAt.seconds !== 'number') return;

            if (data.category === "ipads") {
                let yVal = data.yearValue;
                if (!yVal && data.itemId && data.itemId.includes('-')) {
                    yVal = data.itemId.split('-')[0];
                }
                const yearKey = yVal ? `${yVal}年度` : "未分類・過去のレコード";

                if (!ipadLogsByYear[yearKey]) ipadLogsByYear[yearKey] = [];
                ipadLogsByYear[yearKey].push(data);
            } else {
                otherLogsList.push(data);
            }
        });

        const sortedYears = Object.keys(ipadLogsByYear).sort((a, b) => b.localeCompare(a));
        
        if (sortedYears.length > 0) {
            sortedYears.forEach(yearTitle => {
                const yearLogs = ipadLogsByYear[yearTitle];
                yearLogs.sort((a, b) => b.borrowedAt.seconds - a.borrowedAt.seconds);

                const section = document.createElement('div');
                // 💡 履歴ログテーブルに「ケーブル」と「Pencil」の列を追加
                section.innerHTML = `
                    <h2>📱 iPad製品 履歴ログ [${yearTitle}]</h2>
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 9%;">管理番号</th>
                                <th style="width: 17%;">型番 / モデル名</th>
                                <th style="width: 8%;">状態</th>
                                <th style="width: 12%;">使用者氏名</th>
                                <th style="width: 14%;">用途</th>
                                <th style="width: 9%;">返却予定日</th>
                                <th style="width: 6%;">ケーブル</th>
                                <th style="width: 7%;">Pencil</th>
                                <th style="width: 9%;">使用開始日時</th>
                                <th style="width: 9%;">返却日時</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-log-ipad-${yearTitle}"></tbody>
                    </table>
                `;
                wrapper.appendChild(section);

                const tbody = document.getElementById(`tbody-log-ipad-${yearTitle}`);
                yearLogs.forEach(data => {
                    const row = document.createElement('tr');
                    
                    if (data.status === "borrowed") {
                        row.className = "log-row-rent";    
                    } else {
                        row.className = "log-row-return";  
                    }

                    const rentDateStr = new Date(data.borrowedAt.seconds * 1000).toLocaleString('ja-JP');
                    const returnDateStr = data.returnedAt && data.returnedAt.seconds 
                        ? new Date(data.returnedAt.seconds * 1000).toLocaleString('ja-JP') 
                        : `<span style="color:#aaa;">—</span>`;
                    
                    const statusHTML = data.status === "borrowed" 
                        ? `<span class="badge badge-rent">使用中</span>` 
                        : `<span class="badge badge-return">返却済</span>`;

                    // 💡 目立ちすぎないフラットなテキストで付属品の追跡データを出力
                    const cableText = data.hasCableIncluded !== false ? "付属" : "なし";
                    const pencilText = data.hasPencilOut === true ? "使用中" : "なし";

                    row.innerHTML = `
                        <td><strong>${data.itemId}</strong></td>
                        <td>${data.model || "未設定"}</td>
                        <td>${statusHTML}</td>
                        <td><strong>${data.borrowedByName || "—"}</strong></td>
                        <td><mark>${data.purpose || "—"}</mark></td>
                        <td><b style="color:#0d47a1;">${data.returnPlanDate || "—"}</b></td>
                        <td>${cableText}</td>
                        <td>${pencilText}</td>
                        <td style="font-size:0.75rem; font-weight:500; color:#555;">${rentDateStr}</td>
                        <td style="font-size:0.75rem; font-weight:500; color:#2e7d32;">${returnDateStr}</td>
                    `;
                    tbody.appendChild(row);
                });
            });
        }

        if (otherLogsList.length > 0) {
            otherLogsList.sort((a, b) => b.borrowedAt.seconds - a.borrowedAt.seconds);

            const section = document.createElement('div');
            section.innerHTML = `
                <h2>📹 その他機材 履歴ログ一覧</h2>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 15%;">分類番号-No</th>
                            <th style="width: 35%;">周辺機材名 / モデル</th>
                            <th style="width: 12%;">状態</th>
                            <th style="width: 18%;">使用者氏名</th>
                            <th style="width: 10%;">使用開始日時</th>
                            <th style="width: 10%;">返却日時</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-log-others"></tbody>
                </table>
            `;
            wrapper.appendChild(section);

            const tbody = document.getElementById('tbody-log-others');
            otherLogsList.forEach(data => {
                const row = document.createElement('tr');
                
                if (data.status === "borrowed") {
                    row.className = "log-row-rent";
                } else {
                    row.className = "log-row-return";
                }

                const rentDateStr = new Date(data.borrowedAt.seconds * 1000).toLocaleString('ja-JP');
                const returnDateStr = data.returnedAt && data.returnedAt.seconds 
                    ? new Date(data.returnedAt.seconds * 1000).toLocaleString('ja-JP') 
                    : `<span style="color:#aaa;">—</span>`;
                
                const statusHTML = data.status === "borrowed" 
                    ? `<span class="badge badge-rent">使用中</span>` 
                    : `<span class="badge badge-return">返却済</span>`;

                row.innerHTML = `
                    <td><strong>${data.itemId}</strong></td>
                    <td>${data.model || "未設定"}</td>
                    <td>${statusHTML}</td>
                    <td><strong>${data.borrowedByName || "—"}</strong></td>
                    <td style="font-size:0.75rem; font-weight:500; color:#555;">${rentDateStr}</td>
                    <td style="font-size:0.75rem; font-weight:500; color:#2e7d32;">${returnDateStr}</td>
                `;
                tbody.appendChild(row);
            });
        }

        if (wrapper.innerHTML === "") {
            wrapper.innerHTML = `<div class="empty-log-msg">有効な履歴データがありません。</div>`;
        }
    }, (error) => {
        wrapper.innerHTML = `<div class="empty-log-msg" style="color:#f44336;">データのリアルタイム同期に失敗しました。</div>`;
    });
</script>
</body>
</html>
