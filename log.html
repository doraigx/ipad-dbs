<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機材貸出システム - 履歴ログ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f4f7f9; color: #333; margin: 0; padding: 15px 15px; box-sizing: border-box; font-size: 0.9rem; }
        .container { width: 100%; max-width: 100%; margin: 0 auto; }
        
        h1 { text-align: center; margin-bottom: 15px; color: #0d47a1; font-size: 1.6rem; }
        
        .nav-container { margin-bottom: 15px; display: flex; justify-content: flex-start; }
        .back-btn { padding: 6px 15px; background: #607d8b; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; text-decoration: none; }
        .back-btn:hover { background: #455a64; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); font-size: 0.88rem; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { background-color: #0d47a1; color: white; font-weight: bold; font-size: 0.9rem; }
        
        .badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; color: white; display: inline-block; }
        .badge-ipad { background: #2196f3; }
        .badge-other { background: #9c27b0; }
        .badge-rent { background: #f44336; }
        .badge-return { background: #4caf50; }
        
        tr:hover { background-color: #f4f9ff; }
        mark { background: #ffeb3b; font-weight: bold; padding: 2px 6px; border-radius: 3px; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>物品・機材 貸出返却履歴ログ</h1>
    
    <div class="nav-container">
        <a href="./admin.html" class="back-btn">⬅️ データベース管理画面に戻る</a>
    </div>
    
    <table>
        <thead>
            <tr>
                <th style="width: 10%;">カテゴリ</th>
                <th style="width: 8%;">管理番号</th>
                <th style="width: 26%;">型番 / モデル名</th>
                <th style="width: 11%;">現在の状態</th>
                <th style="width: 11%;">学籍番号</th>
                <th style="width: 12%;">氏名</th>
                <th style="width: 11%;">貸出日時</th>
                <th style="width: 11%;">返却日時</th>
            </tr>
        </thead>
        <tbody id="log-table-body">
            <tr><td colspan="8" style="text-align:center; color:#888;">ログを読み込み中...</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBfoLWu2PPbUoJXH7uxxXCBjxNVWT22gzU",
        authDomain: "ipad-database-2c20b.firebaseapp.com",
        projectId: "ipad-database-2c20b",
        storageBucket: "ipad-database-2c20b.firebasestorage.app",
        messagingSenderId: "558760087924",
        appId: "1:558760087924:web:857e8e8096d78671c49c21",
        measurementId: "G-CEM2VYFRN9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tbody = document.getElementById('log-table-body');

    // 💡 専用のlogsコレクションから、貸出時刻の新しい順にリアルタイム取得
    onSnapshot(query(collection(db, "logs"), orderBy("borrowedAt", "desc")), (snapshot) => {
        tbody.innerHTML = "";
        
        if (snapshot.empty) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#888;">記録されている貸出履歴はありません。</td></tr>`;
            return;
        }

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const row = document.createElement('tr');
            
            const catName = data.category === "ipads" ? "iPad製品" : "その他機材";
            const catClass = data.category === "ipads" ? "badge-ipad" : "badge-other";
            
            const rentDateStr = data.borrowedAt ? new Date(data.borrowedAt.seconds * 1000).toLocaleString('ja-JP') : "不明";
            const returnDateStr = data.returnedAt ? new Date(data.returnedAt.seconds * 1000).toLocaleString('ja-JP') : `<span style="color:#aaa;">—</span>`;
            
            const statusHTML = data.status === "borrowed" 
                ? `<span class="badge badge-rent">🔴 使用中</span>` 
                : `<span class="badge badge-return">🟢 返却済</span>`;

            row.innerHTML = `
                <td><span class="badge ${catClass}">${catName}</span></td>
                <td><strong>No.${data.itemId}</strong></td>
                <td>${data.model || "未設定"}</td>
                <td>${statusHTML}</td>
                <td><mark>${data.borrowedBy || "—"}</mark></td>
                <td><strong>${data.borrowedByName || "—"}</strong></td>
                <td style="font-size:0.8rem; font-weight:500;">${rentDateStr}</td>
                <td style="font-size:0.8rem; font-weight:500;">${returnDateStr}</td>
            `;
            tbody.appendChild(row);
        });
    }, (error) => {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#f44336;">データの読み込みに失敗しました（インデックスの構築を待っている可能性があります）。</td></tr>`;
    });
</script>
</body>
</html>
