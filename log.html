<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機材使用システム - 履歴</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f4f7f9; color: #333; margin: 0; padding: 15px 15px; box-sizing: border-box; font-size: 0.9rem; }
        .container { width: 100%; max-width: 100%; margin: 0 auto; }
        
        h1 { text-align: center; margin-bottom: 15px; color: #0d47a1; font-size: 1.6rem; }
        
        .top-bar { display: flex; gap: 15px; margin-bottom: 15px; align-items: stretch; }
        .search-container { background: #e3f2fd; border: 1px solid #0d47a1; padding: 10px 15px; border-radius: 8px; display: flex; gap: 10px; align-items: center; flex: 1; }
        .search-container label { font-weight: bold; color: #0d47a1; font-size: 0.9rem; white-space: nowrap; }
        .search-input { flex: 1; padding: 8px 12px; border: 1px solid #bbdefb; border-radius: 6px; font-size: 0.9rem; background: white; }
        
        .back-btn { display: flex; align-items: center; justify-content: center; padding: 0 20px; background: #607d8b; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; text-decoration: none; white-space: nowrap; transition: 0.2s; }
        .back-btn:hover { background: #455a64; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); font-size: 0.82rem; margin-bottom: 25px; table-layout: fixed; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        th { background-color: #0d47a1; color: white; font-weight: bold; font-size: 0.85rem; }
        
        tr.log-row-rent { background-color: #ffebee; }   
        tr.log-row-return { background-color: #e8f5e9; } 
        tr:hover { filter: brightness(0.97); }
        
        .badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.72rem; color: white; display: inline-block; }
        .badge-rent { background: #f44336; }
        .badge-return { background: #4caf50; }
        
        /* 💡 変更：黄色のハイライト(mark)用の旧スタイルを撤去。プレーンテキストとして綺麗に出力します */
        .log-purpose-text { font-weight: normal; color: #333; }
        .empty-log-msg { text-align: center; color: #888; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
<div class="container">
    <h1>物品・機材 使用返却履歴</h1>
    
    <div class="top-bar">
        <div class="search-container">
            <label for="log-search-box">🔍 検索：</label>
            <input type="text" id="log-search-box" class="search-input" placeholder="管理番号、モデル名、使用者氏名、用途、日付などでリアルタイムに絞り込み...">
        </div>
        <a href="./admin.html" class="back-btn">データベース管理画面に戻る</a>
    </div>
    
    <div id="log-table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 8%;">管理番号</th>
                    <th style="width: 16%;">型番 / モデル名</th>
                    <th style="width: 8%;">状態</th>
                    <th style="width: 12%;">使用者氏名</th>
                    <th style="width: 15%;">用途</th>
                    <th style="width: 9%;">返却予定日</th>
                    <th style="width: 6%;">ケーブル</th>
                    <th style="width: 6%;">Pencil</th>
                    <th style="width: 10%;">使用開始日時</th>
                    <th style="width: 10%;">返却日時</th>
                </tr>
            </thead>
            <tbody id="tbody-global-log">
                <tr><td colspan="10" class="empty-log-msg">ログをリアルタイム同期中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBfoLWu2PPbUoJXH7uxxXCBjxNVWT22gzU",
        authDomain: "ipad-database-2c20b.firebaseapp.com",
        projectId: "ipad-database-2c20b",
        storageBucket: "ipad-database-2c20b.firebasestorage.app",
        messagingSenderId: "558760087924",
        appId: "1:558760087924:web:857e8e8096d78671c49c21",
        measurementId: "G-CEM2VYFRN9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let globalLogsCached = [];

    onSnapshot(collection(db, "logs"), (snapshot) => {
        globalLogsCached = [];
        
        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if (data && data.borrowedAt && typeof data.borrowedAt.seconds === 'number') {
                globalLogsCached.push(data);
            }
        });

        globalLogsCached.sort((a, b) => b.borrowedAt.seconds - a.borrowedAt.seconds);
        renderGlobalLogTable();
    }, (error) => {
        document.getElementById('tbody-global-log').innerHTML = `<tr><td colspan="10" class="empty-log-msg" style="color:#f44336;">データの同期に失敗しました。</td></tr>`;
    });

    function renderGlobalLogTable() {
        const tbody = document.getElementById('tbody-global-log');
        tbody.innerHTML = "";
        
        const filterWord = document.getElementById('log-search-box').value.trim().toLowerCase();

        if (globalLogsCached.length === 0) {
            tbody.innerHTML = `<tr><td colspan="10" class="empty-log-msg">記録されている使用履歴はまだありません。</td></tr>`;
            return;
        }

        let renderedCount = 0;

        globalLogsCached.forEach(data => {
            const itemId = data.itemId || "—";
            const model = data.model || "未設定";
            const userName = data.borrowedByName || "—";
            const purpose = data.purpose || "—";
            const returnPlan = data.returnPlanDate || "—";
            
            const rentDateStr = new Date(data.borrowedAt.seconds * 1000).toLocaleString('ja-JP');
            const returnDateStr = data.returnedAt && data.returnedAt.seconds 
                ? new Date(data.returnedAt.seconds * 1000).toLocaleString('ja-JP') 
                : "—";

            if (filterWord) {
                const matchId = itemId.toLowerCase().includes(filterWord);
                const matchModel = model.toLowerCase().includes(filterWord);
                const matchUser = userName.toLowerCase().includes(filterWord);
                const matchPurpose = purpose.toLowerCase().includes(filterWord);
                const matchPlan = returnPlan.toLowerCase().includes(filterWord);
                const matchRentDate = rentDateStr.toLowerCase().includes(filterWord);
                const matchReturnDate = returnDateStr.toLowerCase().includes(filterWord);
                
                if (!matchId && !matchModel && !matchUser && !matchPurpose && !matchPlan && !matchRentDate && !matchReturnDate) {
                    return; 
                }
            }

            renderedCount++;
            const row = document.createElement('tr');
            
            if (data.status === "borrowed") {
                row.className = "log-row-rent";    
            } else {
                row.className = "log-row-return";  
            }

            const statusHTML = data.status === "borrowed" 
                ? `<span class="badge badge-rent">使用中</span>` 
                : `<span class="badge badge-return">返却済</span>`;

            const cableText = data.hasCableIncluded !== false ? "有" : "無";
            const pencilText = data.hasPencilOut === true ? "あり" : "なし";

            // 💡 修正：用途の部分のmarkタグを取り除き、すっきりとしたプレーンな文字列表示へお引っ越し
            row.innerHTML = `
                <td><strong>${itemId}</strong></td>
                <td title="${model}">${model}</td>
                <td>${statusHTML}</td>
                <td title="${userName}"><strong>${userName}</strong></td>
                <td title="${purpose}"><span class="log-purpose-text">${purpose}</span></td>
                <td><b style="color:#0d47a1;">${returnPlan}</b></td>
                <td>${cableText}</td>
                <td>${pencilText}</td>
                <td style="font-size:0.75rem; font-weight:500; color:#555;">${rentDateStr}</td>
                <td style="font-size:0.75rem; font-weight:500; color:#2e7d32;">${returnDateStr}</td>
            `;
            tbody.appendChild(row);
        });

        if (renderedCount === 0) {
            tbody.innerHTML = `<tr><td colspan="10" class="empty-log-msg">検索条件に一致する履歴ログは見つかりませんでした。</td></tr>`;
        }
    }

    document.getElementById('log-search-box').oninput = renderGlobalLogTable;
</script>
</body>
</html>
