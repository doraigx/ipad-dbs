<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機材貸出システム - 履歴ログ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f4f7f9; color: #333; margin: 0; padding: 15px 15px; box-sizing: border-box; font-size: 0.9rem; }
        .container { width: 100%; max-width: 100%; margin: 0 auto; }
        
        h1 { text-align: center; margin-bottom: 15px; color: #0d47a1; font-size: 1.6rem; }
        
        .nav-container { margin-bottom: 15px; display: flex; justify-content: flex-start; }
        .back-btn { padding: 6px 15px; background: #607d8b; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; text-decoration: none; }
        .back-btn:hover { background: #455a64; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); font-size: 0.88rem; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { background-color: #0d47a1; color: white; font-weight: bold; font-size: 0.9rem; }
        
        .badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; color: white; display: inline-block; }
        .badge-ipad { background: #2196f3; }
        .badge-other { background: #9c27b0; }
        .badge-rent { background: #f44336; }
        .badge-return { background: #4caf50; }
        
        tr:hover { background-color: #f4f9ff; }
        mark { background: #ffeb3b; font-weight: bold; padding: 2px 6px; border-radius: 3px; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 物品・機材 貸出返却履歴ログ</h1>
    
    <div class="nav-container">
        <a href="./admin.html" class="back-btn">⬅️ データベース管理画面に戻る</a>
    </div>
    
    <table>
        <thead>
            <tr>
                <th style="width: 15%;">日時</th>
                <th style="width: 10%;">カテゴリ</th>
                <th style="width: 8%;">管理番号</th>
                <th style="width: 32%;">型番 / モデル名</th>
                <th style="width: 10%;">アクション</th>
                <th style="width: 12%;">学籍番号</th>
                <th style="width: 13%;">氏名</th>
            </tr>
        </thead>
        <tbody id="log-table-body">
            <tr><td colspan="7" style="text-align:center; color:#888;">ログを読み込み中...</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBfoLWu2PPbUoJXH7uxxXCBjxNVWT22gzU",
        authDomain: "ipad-database-2c20b.firebaseapp.com",
        projectId: "ipad-database-2c20b",
        storageBucket: "ipad-database-2c20b.firebasestorage.app",
        messagingSenderId: "558760087924",
        appId: "1:558760087924:web:857e8e8096d78671c49c21",
        measurementId: "G-CEM2VYFRN9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tbody = document.getElementById('log-table-body');

    let rawIpads = [];
    let rawOthers = [];

    function compileAndRenderLogs() {
        tbody.innerHTML = "";
        const allLogs = [];

        // ① iPad側から「現在貸出中(borrowedAt)」と「最後に返却された(returnedAt)」のタイムスタンプを抽出
        rawIpads.forEach(item => {
            const id = item.id;
            const model = item.model || "未設定";
            
            if (item.status === "borrowed" && item.borrowedAt) {
                allLogs.push({
                    time: item.borrowedAt.seconds,
                    dateStr: new Date(item.borrowedAt.seconds * 1000).toLocaleString('ja-JP'),
                    category: "iPad製品",
                    catClass: "badge-ipad",
                    id: id,
                    model: model,
                    action: "貸出中",
                    actClass: "badge-rent",
                    studentId: item.borrowedBy,
                    name: item.borrowedByName
                });
            }
            if (item.returnedAt) {
                allLogs.push({
                    time: item.returnedAt.seconds,
                    dateStr: new Date(item.returnedAt.seconds * 1000).toLocaleString('ja-JP'),
                    category: "iPad製品",
                    catClass: "badge-ipad",
                    id: id,
                    model: model,
                    action: "返却済",
                    actClass: "badge-return",
                    studentId: item.lastBorrowedBy || "—",
                    name: item.lastBorrowedByName || "—"
                });
            }
        });

        // ② その他機材側からも同様にタイムスタンプを抽出
        rawOthers.forEach(item => {
            const id = item.id;
            const model = item.model || "未設定";
            
            if (item.status === "borrowed" && item.borrowedAt) {
                allLogs.push({
                    time: item.borrowedAt.seconds,
                    dateStr: new Date(item.borrowedAt.seconds * 1000).toLocaleString('ja-JP'),
                    category: "その他機材",
                    catClass: "badge-other",
                    id: id,
                    model: model,
                    action: "貸出中",
                    actClass: "badge-rent",
                    studentId: item.borrowedBy,
                    name: item.borrowedByName
                });
            }
            if (item.returnedAt) {
                allLogs.push({
                    time: item.returnedAt.seconds,
                    dateStr: new Date(item.returnedAt.seconds * 1000).toLocaleString('ja-JP'),
                    category: "その他機材",
                    catClass: "badge-other",
                    id: id,
                    model: model,
                    action: "返却済",
                    actClass: "badge-return",
                    studentId: item.lastBorrowedBy || "—",
                    name: item.lastBorrowedByName || "—"
                });
            }
        });

        if (allLogs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#888;">記録されている貸出履歴はありません。</td></tr>`;
            return;
        }

        // 日時が新しい順（降順）にソート
        allLogs.sort((a, b) => b.time - a.time);

        // HTML出力
        allLogs.forEach(log => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="font-size:0.8rem; font-weight:500;">${log.dateStr}</td>
                <td><span class="badge ${log.catClass}">${log.category}</span></td>
                <td><strong>No.${log.id}</strong></td>
                <td>${log.model}</td>
                <td><span class="badge ${log.actClass}">${log.action}</span></td>
                <td>${log.studentId !== "—" ? `<mark>${log.studentId}</mark>` : "—"}</td>
                <td>${log.name !== "—" ? `<strong>${log.name}</strong>` : "—"}</td>
            `;
            tbody.appendChild(row);
        });
    }

    onSnapshot(collection(db, "ipads"), (snap) => {
        rawIpads = [];
        snap.forEach(doc => rawIpads.push({ id: doc.id, ...doc.data() }));
        compileAndRenderLogs();
    });

    onSnapshot(collection(db, "other_equipments"), (snap) => {
        rawOthers = [];
        snap.forEach(doc => rawOthers.push({ id: doc.id, ...doc.data() }));
        compileAndRenderLogs();
    });
</script>
</body>
</html>
