<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad貸出システム - 管理者画面</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f4f7f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; color: #2196f3; }
        
        .admin-form { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 30px; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
        .form-group label { font-size: 0.85rem; font-weight: bold; color: #555; }
        .form-group input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        .add-btn { padding: 10px 24px; background: #2196f3; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .add-btn:hover { background: #1976d2; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2196f3; color: white; font-weight: bold; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; color: white; }
        .status-ok { background: #4caf50; }
        .status-ng { background: #f44336; }
        tr:hover { background-color: #f1f1f1; }
        
        .action-btn { padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; border: 1px solid #ccc; }
        .return-btn { background: #e0e0e0; color: #333; }
        .return-btn:hover { background: #ddd; }
        .delete-btn { background: #ff4444; color: white; border-color: #ff4444; margin-left: 5px; }
        .delete-btn:hover { background: #cc0000; }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 iPad 貸出管理データベース (管理者)</h1>
    
    <div class="admin-form">
        <div class="form-group">
            <label for="new-ipad-id">管理番号 (重複不可)</label>
            <input type="text" id="new-ipad-id" placeholder="例: 11 や iPad-11">
        </div>
        <div class="form-group">
            <label for="new-ipad-model">型番・モデル名</label>
            <input type="text" id="new-ipad-model" placeholder="例: iPad Air (第6世代)">
        </div>
        <button class="add-btn" id="add-ipad-btn">➕ 新しいiPadを追加</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>管理番号</th>
                <th>型番 / モデル名</th>
                <th>現在の状態</th>
                <th>借用者（学籍番号）</th>
                <th>貸出日時</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="admin-table-body">
            </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔑 新しい専用データベースの設定を適用
    const firebaseConfig = {
        apiKey: "AIzaSyBfoLWu2PPbUoJXH7uxxXCBjxNVWT22gzU",
        authDomain: "ipad-database-2c20b.firebaseapp.com",
        projectId: "ipad-database-2c20b",
        storageBucket: "ipad-database-2c20b.firebasestorage.app",
        messagingSenderId: "558760087924",
        appId: "1:558760087924:web:857e8e8096d78671c49c21",
        measurementId: "G-CEM2VYFRN9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const tbody = document.getElementById('admin-table-body');
    const ipadsQuery = query(collection(db, "ipads"));
    
    onSnapshot(ipadsQuery, (snapshot) => {
        tbody.innerHTML = ""; 

        snapshot.forEach((docSnap) => {
            const id = docSnap.id;
            const data = docSnap.data();
            const model = data.model || "未設定";

            const row = document.createElement('tr');
            
            if (data.status === "borrowed") {
                const dateStr = data.borrowedAt ? new Date(data.borrowedAt.seconds * 1000).toLocaleString('ja-JP') : "不明";
                row.innerHTML = `
                    <td><strong>No.${id}</strong></td>
                    <td>${model}</td>
                    <td><span class="status-badge status-ng">🔴 貸出中</span></td>
                    <td><mark style="background:#ffeb3b; font-weight:bold; padding:2px 6px;">${data.borrowedBy}</mark></td>
                    <td style="font-size:0.9rem;">${dateStr}</td>
                    <td>
                        <button class="action-btn return-btn" onclick="window.forceReturn('${id}')">返却</button>
                        <button class="action-btn delete-btn" onclick="window.deleteIpad('${id}')">削除</button>
                    </td>
                `;
            } else {
                row.innerHTML = `
                    <td>No.${id}</td>
                    <td>${model}</td>
                    <td><span class="status-badge status-ok">🟢 貸出可能</span></td>
                    <td style="color: #aaa;">—</td>
                    <td style="color: #aaa;">—</td>
                    <td>
                        <button class="action-btn delete-btn" onclick="window.deleteIpad('${id}')">削除</button>
                    </td>
                `;
            }
            tbody.appendChild(row);
        });
    });

    // iPadの新規登録
    document.getElementById('add-ipad-btn').addEventListener('click', async () => {
        const idInput = document.getElementById('new-ipad-id').value.trim();
        const modelInput = document.getElementById('new-ipad-model').value.trim();

        if (!idInput || !modelInput) {
            alert("管理番号と型番の両方を入力してください。");
            return;
        }

        try {
            await setDoc(doc(db, "ipads", idInput), {
                model: modelInput,
                status: "available",
                borrowedBy: "",
                createdAt: new Date()
            });
            document.getElementById('new-ipad-id').value = "";
            document.getElementById('new-ipad-model').value = "";
        } catch(e) {
            alert("追加に失敗しました。");
        }
    });

    // 端末の削除
    window.deleteIpad = async function(id) {
        if (!confirm(`【警告】No.${id} のiPadをデータベースから完全に削除しますか？`)) return;
        try {
            await deleteDoc(doc(db, "ipads", id));
        } catch(e) {
            alert("削除に失敗しました。");
        }
    };

    // 強制返却処理
    window.forceReturn = async function(id) {
        if (!confirm(`No.${id} を強制的に返却済みにしますか？`)) return;
        try {
            await setDoc(doc(db, "ipads", id), {
                status: "available",
                borrowedBy: "",
                returnedAt: new Date()
            }, { merge: true });
        } catch(e) {
            alert("返却処理に失敗しました。");
        }
    };
</script>
</body>
</html>
