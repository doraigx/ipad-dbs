<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad貸出システム - 管理者画面</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 💡 画面全体の余白をなくし、フルスクリーン対応にする */
        body { font-family: 'Noto Sans JP', sans-serif; background: #f4f7f9; color: #333; margin: 0; padding: 30px 20px; box-sizing: border-box; }
        
        /* 💡 横幅を100%に広げ、最大幅の制限を解除（フルワイド） */
        .container { width: 100%; max-width: 100%; margin: 0 auto; }
        
        h1 { text-align: center; margin-bottom: 35px; color: #2196f3; font-size: 2.2rem; }
        h2 { font-size: 1.5rem; margin-top: 50px; color: #555; border-left: 6px solid #2196f3; padding-left: 15px; }
        
        .admin-form { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 35px; display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 250px; }
        .form-group label { font-size: 0.95rem; font-weight: bold; color: #555; }
        .form-group input { padding: 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 1.1rem; }
        .add-btn { padding: 14px 40px; background: #2196f3; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .add-btn:hover { background: #1976d2; }

        /* 💡 テーブルを画面端から端までワイドに拡張 */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 20px; font-size: 1.15rem; }
        
        /* 💡 パディングをさらに広げ、1行ずつの視認性と迫力を極限まで高める */
        th, td { padding: 20px 24px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { background-color: #2196f3; color: white; font-weight: bold; font-size: 1.2rem; letter-spacing: 0.5px; }
        
        .status-badge { padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; color: white; display: inline-block; }
        .status-ok { background: #4caf50; }
        .status-ng { background: #f44336; }
        tr:hover { background-color: #f4f9ff; } 
        
        /* 💡 編集用インプット周りも幅広に最適化 */
        .editable-model { cursor: pointer; padding: 8px 14px; border-radius: 6px; transition: 0.2s; background: #f9f9f9; border: 1px dashed #bbb; display: block; width: 95%; box-sizing: border-box; font-weight: 500; }
        .editable-model:hover { background: #fffde7; border-color: #fbc02d; }
        .model-edit-input { padding: 8px 14px; font-size: 1.15rem; border: 2px solid #2196f3; border-radius: 6px; width: 95%; box-sizing: border-box; }

        /* 💡 新設：ボタンを横並びに固定し、はみ出しを防ぐフレックスコンテナ */
        .button-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn { 
            padding: 8px 18px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 0.95rem; 
            font-weight: bold; 
            border: 1px solid #ccc; 
            transition: 0.2s; 
            white-space: nowrap; /* ボタン内の文字が絶対に改行されないようにガード */
        }
        .return-btn { background: #e0e0e0; color: #333; }
        .return-btn:hover { background: #ddd; }
        .delete-btn { background: #ff4444; color: white; border-color: #ff4444; }
        .delete-btn:hover { background: #cc0000; }
        
        .danger-zone { background: #fff3f3; border: 1px solid #ffcdd2; }
        .danger-btn { background: #d32f2f; color: white; }
        .danger-btn:hover { background: #b71c1c; }
        
        .hint-text { font-size: 0.95rem; color: #666; margin-bottom: 12px; padding-left: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 iPad 貸出管理データベース (管理者フルワイド)</h1>
    
    <div class="admin-form">
        <div class="form-group">
            <label for="new-ipad-id">管理番号 (💡半角数字のみ)</label>
            <input type="text" id="new-ipad-id" placeholder="例: 11" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <div class="form-group">
            <label for="new-ipad-model">型番・モデル名</label>
            <input type="text" id="new-ipad-model" placeholder="例: iPad Air (第6世代)">
        </div>
        <button class="add-btn" id="add-ipad-btn">➕ 新しいiPadを追加</button>
    </div>
    
    <p class="hint-text">💡 <b>型番/モデル名</b> を変更したい場合は、該当箇所を<b>ダブルクリック</b>するとその場で編集できます（Enterで保存）。</p>
    
    <table>
        <thead>
            <tr>
                <th style="width: 10%;">管理番号</th>
                <th style="width: 40%;">型番 / モデル名 (ダブルクリックで編集)</th>
                <th style="width: 13%;">現在の状態</th>
                <th style="width: 12%;">借用者（学籍番号）</th>
                <th style="width: 12%;">貸出日時</th>
                <th style="width: 13%;">操作</th> </tr>
        </thead>
        <tbody id="admin-table-body">
        </tbody>
    </table>

    <h2>👤 学生データ管理・修正（学籍番号の変更）</h2>
    <div class="admin-form danger-zone">
        <div class="form-group">
            <label for="student-uid">対象学生のGoogle UID</label>
            <input type="text" id="student-uid" placeholder="例: AIzaSyBCNywQ... (学生から申告されたUID)">
        </div>
        <div class="form-group">
            <label for="correct-student-id">修正後の正しい学籍番号</label>
            <input type="text" id="correct-student-id" placeholder="例: B260099">
        </div>
        <button class="add-btn danger-btn" id="fix-student-btn">🛠️ 学籍番号を強制書き換え</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, query, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBfoLWu2PPbUoJXH7uxxXCBjxNVWT22gzU",
        authDomain: "ipad-database-2c20b.firebaseapp.com",
        projectId: "ipad-database-2c20b",
        storageBucket: "ipad-database-2c20b.firebasestorage.app",
        messagingSenderId: "558760087924",
        appId: "1:558760087924:web:857e8e8096d78671c49c21",
        measurementId: "G-CEM2VYFRN9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tbody = document.getElementById('admin-table-body');

    onSnapshot(query(collection(db, "ipads")), (snapshot) => {
        tbody.innerHTML = ""; 
        snapshot.forEach((docSnap) => {
            const id = docSnap.id;
            const data = docSnap.data();
            const model = data.model || "未設定";
            const row = document.createElement('tr');
            
            let statusHTML = `<span class="status-badge status-ok">🟢 貸出可能</span>`;
            let userHTML = `<span style="color: #aaa;">—</span>`;
            let dateHTML = `<span style="color: #aaa;">—</span>`;
            
            // 💡 貸出可能時：削除ボタンをフレックスコンテナで包む
            let actionHTML = `
                <div class="button-container">
                    <button class="action-btn delete-btn" onclick="window.deleteIpad('${id}')">削除</button>
                </div>
            `;

            if (data.status === "borrowed") {
                const dateStr = data.borrowedAt ? new Date(data.borrowedAt.seconds * 1000).toLocaleString('ja-JP') : "不明";
                statusHTML = `<span class="status-badge status-ng">🔴 貸出中</span>`;
                userHTML = `<mark style="background:#ffeb3b; font-weight:bold; padding:6px 12px; border-radius:4px;">${data.borrowedBy}</mark>`;
                dateHTML = dateStr;
                
                // 💡 貸出中時：返却と削除ボタンをコンテナ内で綺麗に横並び化
                actionHTML = `
                    <div class="button-container">
                        <button class="action-btn return-btn" onclick="window.forceReturn('${id}')">返却</button>
                        <button class="action-btn delete-btn" onclick="window.deleteIpad('${id}')">削除</button>
                    </div>
                `;
            }

            row.innerHTML = `
                <td><strong>No.${id}</strong></td>
                <td>
                    <div class="editable-model" ondblclick="window.startEditModel('${id}', this)">${model}</div>
                </td>
                <td>${statusHTML}</td>
                <td>${userHTML}</td>
                <td style="font-size:1rem; font-weight:500;">${dateHTML}</td>
                <td>${actionHTML}</td>
            `;
            tbody.appendChild(row);
        });
    });

    window.startEditModel = function(id, element) {
        const currentText = element.innerText;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'model-edit-input';
        input.value = currentText;
        
        element.parentNode.replaceChild(input, element);
        input.focus();

        async function saveChanges() {
            const newModelName = input.value.trim();
            if (newModelName && newModelName !== currentText) {
                try {
                    await updateDoc(doc(db, "ipads", id), { model: newModelName });
                } catch(e) { alert("名前の変更に失敗しました。"); }
            } else {
                onSnapshot(doc(db, "ipads", id), () => {}); 
            }
        }

        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveChanges(); });
        input.addEventListener('blur', saveChanges);
    };

    document.getElementById('add-ipad-btn').addEventListener('click', async () => {
        const idInput = document.getElementById('new-ipad-id').value.trim();
        const modelInput = document.getElementById('new-ipad-model').value.trim();

        if (!/^[0-9]+$/.test(idInput)) {
            alert("管理番号は【半角数字】のみで入力してください。");
            return;
        }
        if (!modelInput) {
            alert("型番を入力してください。");
            return;
        }

        try {
            await setDoc(doc(db, "ipads", idInput), {
                model: modelInput,
                status: "available",
                borrowedBy: "",
                createdAt: new Date()
            });
            document.getElementById('new-ipad-id').value = "";
            document.getElementById('new-ipad-model').value = "";
        } catch(e) { alert("追加に失敗しました。"); }
    });

    document.getElementById('fix-student-btn').addEventListener('click', async () => {
        const uid = document.getElementById('student-uid').value.trim();
        const newStudentId = document.getElementById('correct-student-id').value.trim();

        if (!uid || !newStudentId) {
            alert("UIDと新しい学籍番号の両方を正しく入力してください。");
            return;
        }

        if (confirm(`本当にUID: ${uid} の学籍番号を 「${newStudentId}」 に変更しますか？`)) {
            try {
                await setDoc(doc(db, "users", uid), { studentId: newStudentId }, { merge: true });
                alert("学籍番号の書き換えが正常に完了しました。");
                document.getElementById('student-uid').value = "";
                document.getElementById('correct-student-id').value = "";
            } catch(e) { alert("学生データの書き換えに失敗しました。UIDが正しいか確認してください。"); }
        }
    });

    window.deleteIpad = async function(id) {
        if (!confirm(`【警告】No.${id} のiPadをデータベースから完全に削除しますか？`)) return;
        try { await deleteDoc(doc(db, "ipads", id)); } catch(e) { alert("削除に失敗しました。"); }
    };

    window.forceReturn = async function(id) {
        if (!confirm(`No.${id} を強制的に返却済みにしますか？`)) return;
        try { await setDoc(doc(db, "ipads", id), { status: "available", borrowedBy: "" }, { merge: true }); } catch(e) { alert("返却処理に失敗しました。"); }
    };
</script>
</body>
</html>
