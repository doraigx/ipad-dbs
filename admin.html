<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>機材管理データベース管理画面</title>
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f4f7f9; padding: 20px; }
        .row-long-borrowed { background-color: #e3f2fd !important; } /* 水色背景 */
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; color: white; }
        .badge-long { background: #2196f3; }
    </style>
</head>
<body>
    <h1>データベース管理画面</h1>
    <table>
        <thead>
            <tr>
                <th>管理番号</th>
                <th>状態変更</th>
            </tr>
        </thead>
        <tbody id="admin-tbody">
            </tbody>
    </table>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { /* (設定省略) */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(collection(db, "ipads"), (snapshot) => {
        const tbody = document.getElementById('admin-tbody');
        tbody.innerHTML = "";
        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const tr = document.createElement('tr');
            if(data.status === "long_borrowed") tr.className = "row-long-borrowed";
            
            tr.innerHTML = `
                <td>${data.itemId}</td>
                <td>
                    <select onchange="updateStatus('${docSnap.id}', this.value)">
                        <option value="available" ${data.status === "available" ? "selected" : ""}>利用可能</option>
                        <option value="borrowed" ${data.status === "borrowed" ? "selected" : ""}>使用中</option>
                        <option value="long_borrowed" ${data.status === "long_borrowed" ? "selected" : ""}>長期貸出中</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });
    });

    window.updateStatus = async (id, status) => {
        await updateDoc(doc(db, "ipads", id), { status: status });
    };
</script>
</body>
</html>
